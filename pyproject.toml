[project]
name = "pytest-together"
version = "0.1.0"
description = "Run things at the same instant in a test, and fail if they did not actually overlap."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Parham Roozmand" }]
keywords = ["pytest", "concurrency", "race-condition", "testing", "asyncio", "threads"]
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# pytest only. A testing plugin that drags a dependency tree into somebody's test
# environment is one more thing for them to resolve, pin and upgrade.
dependencies = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Nappuccino-tlg/pytest-together"
Issues = "https://github.com/Nappuccino-tlg/pytest-together/issues"

[project.entry-points.pytest11]
together = "pytest_together.plugin"

[project.optional-dependencies]
dev = ["pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# No --cov here on purpose. A pytest plugin is imported through its entry point
# before pytest-cov starts measuring, so --cov reports most of this package as
# unreached and the number is a lie. Use `coverage run -m pytest` instead, which
# starts measuring first -- that is what CI does.
addopts = "-q"

[tool.coverage.run]
source = ["pytest_together"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 96
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# N818 wants an Error suffix. NotConcurrent is what the failure is called in the
# README and in every `pytest.raises(...)` that catches it, and NotConcurrentError
# reads worse at both of those, which is where people meet it.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately race on shared state and catch broad exceptions to prove a point.
"tests/*" = ["B023", "BLE001"]
